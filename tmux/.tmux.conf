# =========================
# Prefix
# =========================

# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# =========================
# General
# =========================
# Terminal
set -g default-terminal "tmux-256color"

# Terminal
set -g default-terminal "tmux-256color"
# set -as terminal-overrides ',*:Tc'

# True Color
# set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",ghostty:RGB"

# Extended keys
# set -g extended-keys on

set -g status off
set -g mouse on
set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on
setw -g automatic-rename on

# =========================
# Theme
# =========================

# Keep tmux 3.8 theme detection
# set -s theme detect
if-shell -F '#{>=:#{version},3.8}' 'set -s theme detect'

# Popup
set -g popup-style 'bg=default,fg=default'
set -g popup-border-style 'bg=default,fg=#999999'
set -g popup-border-lines single
# Tree mode border (tmux 3.8+)
if-shell -F '#{>=:#{version},3.8}' \
    "set -g tree-mode-border-style 'bg=default,fg=#999999'"

# =========================
# Vim Style
# =========================

setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize pane

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind E select-layout even-horizontal
bind V select-layout even-vertical


# =========================
# Split
# =========================

unbind '"'
unbind %

bind | split-window -h -l 30%
bind - split-window -v -l 30%
bind Tab last-window

# =========================
# Navigation
# =========================

bind f display-popup -E "
target=\$(tmux list-windows -a -F '#{session_name}:#{window_index}:#{window_name}' |
    fzf |
    sed 's/:[^:]*$//')
if [ -n \"\$target\" ]; then
    tmux switch-client -t \"\$target\"
fi
"

# =========================
# Reload
# =========================

bind r source-file ~/.tmux.conf \; display "tmux reloaded"

# =========================
# Copy Mode
# =========================

setw -g mode-keys vi

bind Enter copy-mode

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# sync to system clipboard
set-option -s set-clipboard on

# mouse select copy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# =========================
# Status Bar
# =========================

set -g status-position bottom
set -g status-style bg=default

set -g status-left "[#S] "
set -g status-right "%H:%M"

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=green
