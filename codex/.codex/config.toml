model = "gpt-5.5"
model_reasoning_effort = "medium"

# 默认：安全但不太烦
sandbox_mode = "workspace-write"
approval_policy = "on-request"

# 风格：建议你用 pragmatic，少废话，偏工程判断
personality = "pragmatic"

# 有需要排查 CLI 行为时再打开
# log_dir = "/Users/Clloz/.codex/logs"

[sandbox_workspace_write]
# 允许 workspace 内写入；跨目录时再加 writable_roots
# writable_roots = ["/Users/Clloz/work", "/Users/Clloz/github"]

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"

[projects."/Users/Clloz/Work/keenon/robotviz-4.0"]
trust_level = "trusted"

[projects."/Users/Clloz/dotfiles"]
trust_level = "trusted"

[projects."/Users/Clloz/github/astro-blog"]
trust_level = "trusted"

[projects."/Users/Clloz/work/keenon/rviz-app"]
trust_level = "trusted"

[projects."/Users/Clloz/work/keenon/robotviz-monitor"]
trust_level = "trusted"

[projects."/Users/Clloz/.codex"]
trust_level = "trusted"

[tui.model_availability_nux]
"gpt-5.5" = 4
